# Q-04 / S-06: tests, build and dependency audit on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking
          POSTGRES_DB: parking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parking" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://parking:parking@localhost:5432/parking
      TEST_DATABASE_URL: postgresql://parking:parking@localhost:5432/parking_test
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-secret
      PAYMENT_PROVIDER: mock
      MOCK_WEBHOOK_SECRET: ci-mock-secret
      DEV_TOOLS: "true"
      HIBP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Create test database
        run: PGPASSWORD=parking psql -h localhost -U parking -c "CREATE DATABASE parking_test"
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - name: All translation keys exist in German and English (L-02)
        run: npm run i18n:check
      - name: Unit and integration tests
        run: npm test
      - run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (request -> confirm -> payment -> cancellation)
        run: |
          npm start > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            app.log
